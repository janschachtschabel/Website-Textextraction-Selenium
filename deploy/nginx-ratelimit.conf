# Inbound-Rate-Limits für die Volltextextraktion-API.
#
# Diese Zonen müssen im http{}-Block stehen. Auf Debian/Ubuntu:
#   cp deploy/nginx-ratelimit.conf /etc/nginx/conf.d/volltextextraktion-ratelimit.conf
#
# Ohne diese Datei lädt deploy/nginx.conf nicht (unknown limit_req_zone) - das ist
# beabsichtigt: der Server-Block begrenzt eingehende Anfragen standardmäßig.
#
# Die Anwendung selbst begrenzt nur ausgehende Dokumentabrufe (GLOBAL_RATE_LIMIT_RPS,
# DEFAULT_DOMAIN_RATE_LIMIT_RPS); eingehende Anfragen begrenzt ausschließlich nginx.

limit_req_zone $binary_remote_addr zone=crawl_per_ip:10m rate=5r/s;
limit_req_zone $server_addr        zone=crawl_global:1m  rate=20r/s;

# 429 statt 503 zurückgeben, passend zu den HTTP-Statuscodes der API.
limit_req_status 429;

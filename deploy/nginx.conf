# nginx Reverse-Proxy Konfiguration für Volltextextraktion API
#
# Einsatz:
#   1. Rate-Limit-Zonen bereitstellen:
#      cp deploy/nginx-ratelimit.conf /etc/nginx/conf.d/volltextextraktion-ratelimit.conf
#   2. Zertifikat besorgen, z.B. certbot certonly --nginx -d your-domain.example
#   3. Diese Datei nach /etc/nginx/sites-available/volltextextraktion kopieren,
#      server_name und die beiden ssl_certificate-Pfade anpassen
#   4. Symlink anlegen: ln -s /etc/nginx/sites-available/volltextextraktion /etc/nginx/sites-enabled/
#   5. Konfiguration prüfen: nginx -t
#   6. Nginx neu laden: systemctl reload nginx
#
# Voraussetzung: API läuft auf localhost:8000 (python run.py oder hatch run serve)
# Der Bearer-Token wird bei jeder Anfrage mitgeschickt: kein Klartext-HTTP.

upstream volltextextraktion {
    # Uvicorn lauscht mit mehreren Worker-Prozessen auf einem Socket.
    # Alle Worker teilen denselben Port — ein upstream-Eintrag genügt.
    server 127.0.0.1:8000;

    # Keepalive-Verbindungen zum Backend wiederverwenden (reduziert TCP-Overhead)
    keepalive 32;
}

# ── HTTP: ausschließlich Weiterleitung ───────────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    server_name your-domain.example;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name your-domain.example;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── Größenlimits ──────────────────────────────────────────────────────────
    # Zweite Verteidigungslinie; die Anwendung begrenzt Bodies selbst (MAX_REQUEST_BYTES).
    client_max_body_size 2M;    # Batch-Request mit 50 URLs + Optionen bleibt weit darunter

    # ── Timeouts ─────────────────────────────────────────────────────────────
    # All URL deadlines, including batch queue time, are at most 600s; allow cleanup margin
    proxy_connect_timeout   10s;
    proxy_send_timeout      620s;
    proxy_read_timeout      620s;
    send_timeout            620s;

    # ── Proxy-Header ─────────────────────────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HTTP/1.1 für Keepalive zum Backend erforderlich
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ── Haupt-Location ────────────────────────────────────────────────────────
    location / {
        limit_req zone=crawl_per_ip burst=10 nodelay;
        proxy_pass http://volltextextraktion;
    }

    # ── Health-Check ohne Auth (für Load-Balancer / Monitoring) ──────────────
    location /health {
        proxy_pass http://volltextextraktion;
        access_log off;
    }

    # ── Crawl-Endpunkte: zusätzlich global begrenzt ──────────────────────────
    # Zonen siehe deploy/nginx-ratelimit.conf. Ausgehende Dokumentabrufe begrenzt
    # die Anwendung getrennt davon über alle Worker mit gemeinsamem RESULT_CACHE_DIR.
    location /crawl {
        limit_req zone=crawl_per_ip burst=10 nodelay;
        limit_req zone=crawl_global burst=20 nodelay;
        proxy_pass http://volltextextraktion;
    }
}

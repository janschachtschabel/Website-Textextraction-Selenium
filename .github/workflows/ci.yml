name: extraction checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev,documents,loadtest]'
      - run: ruff check app tests helper/loadtest.py
      - run: pytest -q -m 'not selenium'
      # diskcache has no fixed release for PYSEC-2026-2447 (pickle deserialization);
      # the service stores JSON in a private directory instead. Any other advisory fails the build.
      - run: pip-audit --ignore-vuln PYSEC-2026-2447
      - run: python -m compileall -q app helper run.py
      - run: python -m build --no-isolation
  selenium:
    runs-on: ubuntu-24.04
    env:
      RUN_SELENIUM_TESTS: '1'
      # The runner's packaged Chrome has Ubuntu's sandbox profile; arbitrary
      # Chrome-for-Testing download paths cannot use it under AppArmor.
      CHROME_BINARY: /usr/bin/google-chrome
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev,documents]'
      - name: Verify Chrome can start with sandboxing enabled
        run: |
          "$CHROME_BINARY" --version
          "$CHROMEDRIVER_PATH" --version
          timeout 15 "$CHROME_BINARY" --headless --disable-background-networking --dump-dom about:blank
      - run: pytest -q tests/test_selenium_integration.py

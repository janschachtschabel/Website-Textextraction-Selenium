# Deployable as it stands. A panel that takes a compose URL - Hostinger's Docker Manager,
# Portainer, Coolify - fetches only this file, so nothing here may need a build context or
# a checkout. It pulls a published image instead.
#
# Set API_KEY as an environment variable in the panel. It is not listed under
# environment: on purpose: a panel injects its variables into the container, and naming it
# here with a default would overwrite whatever the panel set with an empty value. The
# service binds 0.0.0.0 inside the container and refuses to start without a key, so a
# missing one fails in the container log with that sentence, rather than aborting compose
# before anything runs.
#
# A clone of this repository builds instead of pulling: docker-compose.override.yml adds
# the build, and compose merges it automatically. Its .env supplies the key and, from
# .env.example, BIND_ADDRESS=127.0.0.1.
services:
  extraction:
    # Pinned, not :latest - an unattended pull should never change the version running.
    # tests/test_packaging.py keeps this level with app/__init__.py.
    image: jschachtschabel/website-textextraction:2.1.0
    # Chrome forks helpers that outlive a crash; without an init they accumulate as
    # zombies until the container hits its process limit.
    init: true
    environment:
      LOG_JSON: "true"
      UVICORN_WORKERS: "2"
    ports:
      # Reachable by default, because the deployment that cannot configure anything is the
      # one that needs it. What is published is key-protected: the service always binds
      # 0.0.0.0 inside the container and so always requires API_KEY. Set BIND_ADDRESS to
      # 127.0.0.1 to publish on loopback only and put a reverse proxy in front.
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8000}:8000"
    volumes:
      # A named volume inherits the directory's owner and its 0700 mode from the image.
      # A bind mount does not, and the service then refuses to open the cache.
      - extraction-cache:/var/cache/website-text-extraction
    restart: unless-stopped
    # Consistent with the image, which runs Chrome without its own sandbox because
    # Docker's seccomp profile blocks the namespaces that sandbox needs. The container
    # is the boundary; the README describes the alternative and what it costs.
    security_opt:
      - no-new-privileges:true

volumes:
  extraction-cache:

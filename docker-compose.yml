# Deployable as it stands. A panel that deploys from the URL of a compose file - Hostinger's
# Docker Manager, Portainer, Coolify - fetches only this file and pulls the image it names,
# so nothing here may need a build context or a checkout.
#
# In the panel set exactly one variable: API_KEY, with a value. Not HOST or PORT, which come
# from the image - HOST=127.0.0.1 would make the service listen on the container's own
# loopback, where the published port reaches nothing. And do not paste .env.example there:
# it is written for a .env file, a panel reads one NAME=VALUE per row, so its comment lines
# become invalid entries and its empty API_KEY= stops the service.
#
# API_KEY is named below without a value. Compose then takes whatever the panel provides and
# leaves the variable unset when nothing does, rather than setting it to empty and
# overwriting a value injected by another route. The required form ${API_KEY:?...} is what
# it cannot be: that aborts while compose reads the file, asking for a .env the operator has
# no way to write. Unset, the container starts and names what is missing in its own log.
#
# A clone builds instead of pulling: docker-compose.override.yml adds the build, and compose
# merges it automatically. Its .env supplies the key and BIND_ADDRESS=127.0.0.1.
services:
  extraction:
    # Pinned, not :latest - an unattended pull should never change the version running.
    # tests/test_packaging.py keeps this level with app/__init__.py.
    image: jschachtschabel/website-textextraction:3.0.0
    # Chrome forks helpers that outlive a crash; without an init they accumulate as
    # zombies until the container hits its process limit.
    init: true
    environment:
      # Every setting the service reads, passed through without a value: compose takes
      # each from the panel or the environment and leaves out the ones nobody names, so
      # the image's own defaults apply. docs/settings.md says what each one does.
      #
      # HOST and PORT are deliberately absent. They come from the image, and HOST=127.0.0.1
      # would make the service listen on the container's own loopback, where the published
      # port reaches nothing.
      - ALLOW_INSECURE_SSL
      - API_KEY
      - CHROMEDRIVER_PATH
      - CHROME_BINARY
      - CONVERSION_WORKERS
      - DEFAULT_ACCEPT_LANGUAGE
      - DEFAULT_DOMAIN_RATE_LIMIT_RPS
      - DEFAULT_HEADLESS
      - DEFAULT_JS_AUTO_WAIT
      - DEFAULT_JS_STRATEGY
      - DEFAULT_MAX_BYTES
      - DEFAULT_MODE
      - DEFAULT_RETRIES
      - DEFAULT_TIMEOUT_SECONDS
      - DEFAULT_USER_AGENT
      - GLOBAL_RATE_LIMIT_RPS
      - HTML_CONVERTER
      - HTTP_MAX_CONNECTIONS
      - INBOUND_RATE_LIMIT_BURST
      - INBOUND_RATE_LIMIT_RPS
      - JOB_RESULT_TTL
      - LOG_JSON=${LOG_JSON:-true}
      - LOG_LEVEL
      - MAX_ACTIVE_JOBS
      - MAX_CONCURRENT_REQUESTS
      - MAX_QUEUE_SIZE
      - MAX_REQUEST_BYTES
      - MAX_TIMEOUT_SECONDS
      - MAX_URLS_PER_REQUEST
      - MEDIA_CONVERSION_POLICY
      - PRESIDIO_DE_MODEL
      - PRESIDIO_EN_MODEL
      - QUEUE_TIMEOUT_SECONDS
      - RESPECT_ROBOTS_TXT
      - RESULT_CACHE_DIR
      - RESULT_CACHE_MAX_SIZE
      - RESULT_CACHE_TTL
      - REVALIDATION_TTL
      - SELENIUM_MAX_POOL_SIZE
      - SELENIUM_NO_SANDBOX
      - SSRF_PROTECTION
      - TRAFILATURA_CLEAN_MARKDOWN
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      - WORKER_MAX_JOBS
    ports:
      # Reachable by default, because the deployment that cannot configure anything is the
      # one that needs it. What is published is key-protected: the service always binds
      # 0.0.0.0 inside the container and so always requires API_KEY. Set BIND_ADDRESS to
      # 127.0.0.1 to publish on loopback only and put a reverse proxy in front.
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8000}:8000"
    volumes:
      # A named volume inherits the directory's owner and its 0700 mode from the image.
      # A bind mount does not, and the service then refuses to open the cache.
      - extraction-cache:/var/cache/website-text-extraction
    restart: unless-stopped
    # Consistent with the image, which runs Chrome without its own sandbox because
    # Docker's seccomp profile blocks the namespaces that sandbox needs. The container
    # is the boundary; the README describes the alternative and what it costs.
    security_opt:
      - no-new-privileges:true

volumes:
  extraction-cache:

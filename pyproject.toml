# ---------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "volltextextraktion-selenium-md"
dynamic = ["version"]
description = "Bounded HTTP-first text extraction with isolated Selenium rendering"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.135.1,<1",
    "uvicorn[standard]>=0.42.0,<1",
    "httpx[http2]>=0.28.1,<0.29",
    "selenium>=4.41.0,<5",
    "markitdown>=0.1.7,<0.2",
    "trafilatura>=2.2.0,<3",
    "beautifulsoup4>=4.14.3,<5",
    "lxml>=5.3.0,<7",
    "python-dotenv>=1.0.1,<2",
    "loguru>=0.7.3,<1",
    "diskcache>=5.6.0,<6",
]

[project.optional-dependencies]
documents = ["markitdown[pdf,docx,pptx,xls,xlsx,outlook]>=0.1.7,<0.2"]
pii = ["presidio-analyzer>=2.2.0,<3", "presidio-anonymizer>=2.2.0,<3", "spacy>=3.7.0,<4"]
dev = [
    "ruff>=0.11.0,<1",
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.25.0,<2",
    "build>=1.2,<2",
    "hatchling>=1.27",
    "cryptography>=42,<50",  # self-signed certificate for the browser TLS test
]
loadtest = ["aiohttp>=3.9.0,<4", "matplotlib>=3.9.0,<4", "numpy>=1.26.0,<3"]

[tool.hatch.version]
path = "app/__init__.py"

# ---------------------------------------------------------------------------
# Package discovery
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Hatch environments (run with: hatch run serve / hatch run dev)
# ---------------------------------------------------------------------------
[tool.hatch.envs.default]
dependencies = []  # inherits project.dependencies via editable install

[tool.hatch.envs.default.scripts]
serve    = "python run.py"
dev      = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
lint     = "ruff check app tests helper/loadtest.py"
fmt      = "ruff format app/"
loadtest = "python helper/loadtest.py"

# ---------------------------------------------------------------------------
# Ruff – linter + formatter configuration
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in default arguments (FastAPI dependency injection)
    "SIM117",  # nested with statements (readability preference)
    "UP007",   # X | Y union syntax (keep Optional for compatibility)
    "RUF001",  # ambiguous unicode in strings (intentional en-dashes / special chars)
    "RUF002",  # ambiguous unicode in docstrings (intentional: × in resolutions, – in ranges)
    "RUF003",  # ambiguous unicode in comments (intentional en-dashes)
    "SIM105",  # contextlib.suppress – try/except/pass is clearer in complex control flow
]

[tool.ruff.lint.per-file-ignores]
"app/schemas.py" = ["UP006", "UP007", "UP035"]  # keep List/Optional for Pydantic compat
"colab_deployment_fixed.py" = ["E402"]  # intentional: print() before imports in Colab script

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["selenium: real Chrome integration (RUN_SELENIUM_TESTS=1)"]
